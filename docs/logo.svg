<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Manuel Westermeier</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#0d1a3a"/>
      <stop offset="1" stop-color="#030409"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c4ff"/>
      <stop offset="1" stop-color="#1e5bff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Drahtgitter-Kugel dezent im Hintergrund -->
  <g fill="none" stroke="#5b8bff" stroke-opacity="0.22" stroke-width="3">
    <circle cx="256" cy="256" r="196"/>
    <ellipse cx="256" cy="256" rx="70" ry="196"/>
    <ellipse cx="256" cy="256" rx="140" ry="196"/>
    <ellipse cx="256" cy="256" rx="196" ry="46"/>
    <ellipse cx="256" cy="160" rx="170" ry="34"/>
    <ellipse cx="256" cy="352" rx="170" ry="34"/>
  </g>

  <!-- Leuchten hinter dem M -->
  <g filter="url(#glow)" opacity="0.6" fill="#1e5bff">
    <rect x="96" y="120" width="56" height="272" rx="28"/>
    <rect x="360" y="120" width="56" height="272" rx="28"/>
  </g>

  <!-- M aus Strichen: oben bündig, zur Mitte kürzer – die Kerbe des M -->
  <rect x="96" y="120" width="56" height="272" rx="28" fill="url(#blue)"/>
  <rect x="162" y="120" width="56" height="196" rx="28" fill="url(#blue)"/>
  <rect x="228" y="120" width="56" height="128" rx="28" fill="url(#gold)"/>
  <rect x="294" y="120" width="56" height="196" rx="28" fill="url(#blue)"/>
  <rect x="360" y="120" width="56" height="272" rx="28" fill="url(#blue)"/>
</svg>
